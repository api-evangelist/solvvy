name: Solvvy
description: 'Solvvy was a conversational-AI and customer-support automation platform that let companies
  deploy self-service virtual agents to understand end-customer questions, resolve issues, and deflect
  support tickets across chat and web channels. Zoom announced a definitive agreement to acquire Solvvy
  in May 2022 and folded its natural-language and workflow-automation technology into Zoom Contact Center
  and the Zoom Virtual Agent product. As of this profile the standalone Solvvy brand is discontinued:
  solvvy.com no longer serves a site (HTTPS connection refused) and the company publishes no independent,
  live public API, developer portal, or documentation. This repo is retained as a historical company
  record; there is no active API surface to enrich.'
